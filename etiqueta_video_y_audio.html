    <title>Etiqueta de video y audio</title>
</head>
<body>
    <h1>1. Etiquetas de video y audio</h1>
    <h2>Manejo de video</h2>
    <video width="600" height="400" controls loop poster="Imagenes/tablas-daimiel.webp">
        <source src="Video/Publicar20s.mp4" type="video/mp4">
        <source src="Video/Publicar20s.webm" type="video/webm">
        <source src="Video/Publicar20s.ogv" type="video/ogg">
        Tu navegador no soporta este formato de video.
    </video>
    <h2>Manejo de audio</h2>
    <audio style="width: 500px;" controls loop>
        <source src="Audio/audio.mp3" type="audio/mpeg">
        <source src="Audio/audio.m4a" type="audio/mpeg">
        <source src="Audio/audio.ogg" type="audio/ogg">
        Tu navegador no soporta este formato de audio.
    </audio>
