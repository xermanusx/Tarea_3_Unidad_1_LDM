<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta IFrame</title>
</head>
<body>
    <h1>Etiqueta IFrame</h1>
    <p>La etiqueta IFrame se utiliza para insertar otro documento HTML dentro del documento actual.</p>
    <h2>Periodico del dia</h2>
    <iframe src="https://www.abc.es/" width="600" height="400" frameborder="0"></iframe>
    <iframe src="https://elpais.com" width="600" height="400" frameborder="0"></iframe>
    <h2>Video del IES Juan Bosco</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/eKabc74IU7o?si=Owt2MNF3dijXI_eq" 
    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media;gyroscope;
     picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
     <h2>Mapa del IES Juan Bosco</h2>
   <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3083.442382527034!2d-3.2219084!3d39.39149659999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e0!3m2!1ses!2ses!4v1795464317391!5m2!1ses!2ses"
    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p><a href="index.html">Volver al índice</a></p>
</body>
</html>
